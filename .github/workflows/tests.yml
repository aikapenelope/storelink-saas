name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: storelink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URI: postgres://postgres:postgres@localhost:5432/storelink_test
      PAYLOAD_SECRET: test-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # Credenciales ficticias: el SDK de Trello está mockeado en los tests
      # (ejercita el camino completo sin red ni cuenta real).
      TRELLO_API_KEY: test-trello-key
      TRELLO_TOKEN: test-trello-token
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Auditoría 2026-09-04 (P2): antes solo typecheck + test. Sin lint ni
      # build en CI, errores de boundary server/client y del importMap del
      # admin llegaban directo al deploy de Vercel, y los advisories de deps
      # no tenían señal automatizada.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Tests unitarios + integración
        run: pnpm test

      # El build en CI permite PAYLOAD_SECRET de prueba: el fallback del secreto
      # solo se permite en fase de build (NEXT_PHASE), nunca en runtime prod.
      - name: Build de producción
        run: pnpm build

      - name: Audit de dependencias (prod)
        run: pnpm audit --prod --audit-level high