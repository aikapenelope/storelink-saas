name: jobs-daily

on:
  schedule:
    # 07:23 UTC = 03:23 America/Caracas: fuera del pico de pedidos.
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Purgar Notas de Entrega >180d (auditoria 2026-09-04, P1-12)
        run: |
          curl -fsS -m 300 -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ vars.PROD_BASE_URL || 'https://flow.martes.app' }}/api/admin/purge-delivery-notes"
